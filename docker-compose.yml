services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brand-guardian-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - api_data:/app/backend/data
    networks:
      - brand-guardian-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: brand-guardian-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - brand-guardian-net


volumes:
  api_data:
    driver: local

networks:
  brand-guardian-net:
    driver: bridge
